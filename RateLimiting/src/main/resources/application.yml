server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG


spring:
  application:
    name: api-gateway

  redis:
    host: localhost
    port: 6379

  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@ipKeyResolver}"
            redis-rate-limiter.replenishRate: 5
            redis-rate-limiter.burstCapacity: 10
            redis-rate-limiter.requestedTokens: 1
        - name: CircuitBreaker
          args:
            name: fallbackCmd
            fallbackUri: forward:/rate-limit-exceeded

      routes:
        - id: sample-api
          uri: http://localhost:8081
          predicates:
            - Path=/api/sample/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 4
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: sampleApiCircuit
                fallbackUri: forward:/rate-limit-exceeded
                statusCodes: 429


